# Sealed Secrets — lets an encrypted Secret live in git.
#
# The problem it solves: Argo CD syncs from git, and a Kubernetes Secret is
# only base64-encoded, not encrypted. Committing one is committing the
# password. kubeseal encrypts a Secret with this controller's PUBLIC key; the
# result (a SealedSecret) is safe to commit, and only the controller's PRIVATE
# key, which never leaves the cluster, can turn it back into a Secret.


apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    # Deleting this Application also deletes what it deployed. Standard for
    # child apps; see root-app.yaml for why the root does not have it.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.20.0
    helm:
      valuesObject:
        # The chart names the controller `sealed-secrets`, but the kubeseal
        # CLI looks for `sealed-secrets-controller` in kube-system. Matching
        # the CLI's defaults means kubeseal works with no extra flags.
        fullnameOverride: sealed-secrets-controller
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits:   { memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true