apiVersion: v1
kind: ConfigMap
metadata:
  name: rootsmarket-config
  namespace: rootsmarket
  labels:
    app.kubernetes.io/part-of: rootsmarket
data:
  NODE_ENV: "production"

  NODE_OPTIONS: "--max-old-space-size=128"

  POSTGRES_HOST: "postgres.rootsmarket.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "rootsmarket"
  POSTGRES_IDLE_TIMEOUT_MS: "30000"
  POSTGRES_CONNECT_TIMEOUT_MS: "3000"

  REDIS_URL: "redis://redis.rootsmarket.svc.cluster.local:6379"
  CACHE_TTL_SECONDS: "300"

  CORS_ORIGIN: "http://localhost:30080"

  # Cross-namespace. The app knows exactly one thing about the platform.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_SERVICE_NAMESPACE: "rootsmarket"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "1.0"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_LOG_LEVEL: "info"
  OTEL_BSP_EXPORT_TIMEOUT: "5000"
  OTEL_BSP_SCHEDULE_DELAY: "1000"