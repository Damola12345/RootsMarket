# Redis — Deployment, NOT a StatefulSet.
# Redis here is a cache. Every value in it is derived from Postgres and can be
# recomputed. Losing it costs a few slow requests, not data. So none of the
# three things a StatefulSet provides is needed:
#
#   stable identity   nothing addresses a specific redis pod
#   stable storage    there is nothing worth persisting
#   ordered startup   one replica, nothing to order
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: rootsmarket
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP        # a normal virtual IP, unlike the headless postgres one
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: rootsmarket
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate. Two redis pods behind one Service during a
    # rollout would split the cache: some reads hit the new empty pod and miss
    # keys the old one holds. Harmless here, but the reasoning is the same one
    # that makes RollingUpdate wrong for anything holding local state.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent

          args:
            - "--maxmemory"
            - "192mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
            - "--save"
            - ""                       

          ports:
            - name: redis
              containerPort: 6379

          livenessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests: { memory: "256Mi", cpu: "50m" }
            limits:   { memory: "256Mi" }

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true      
            capabilities: { drop: ["ALL"] }

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}