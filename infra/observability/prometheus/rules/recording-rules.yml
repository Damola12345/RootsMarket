
groups:

  # HTTP
  # The highest-value group. p95/p99 are the poster child for recording rules:
  # histogram_quantile over every bucket series is the most expensive thing on
  # the Overview dashboard, and it renders on every refresh.
  - name: rootsmarket_http
    interval: 15s
    rules:

      - record: rootsmarket:http_requests:rate5m
        expr: |
          sum by (service) (rate(http_requests_total[5m]))

      # Used by the Overview dashboard AND the HighErrorRatio alert.
      #
      # The `or` branch makes this return 0 rather than no-data when a service
      # has had no 5xx at all — without it the panel reads "No data" during the
      # healthy case, which is the state you most want to see confirmed.
      #
      # clamp_min avoids divide-by-zero when a service is idle.
      - record: rootsmarket:http_5xx_error_ratio:rate5m
        expr: |
          (
            sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
            or on (service)
            (0 * sum by (service) (rate(http_requests_total[5m])))
          )
          /
          clamp_min(sum by (service) (rate(http_requests_total[5m])), 0.000001)

      # `le` must survive the aggregation or histogram_quantile cannot work.
      - record: rootsmarket:http_request_duration_seconds:p95_5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (service, le) (rate(http_request_duration_seconds_bucket[5m]))
          )

      - record: rootsmarket:http_request_duration_seconds:p99_5m
        expr: |
          histogram_quantile(
            0.99,
            sum by (service, le) (rate(http_request_duration_seconds_bucket[5m]))
          )

  # ----------------------------------------------------------------- ratios
  # Kept because ratios are error-prone to retype (the clamp_min guard is easy
  # to forget) and each is used on more than one dashboard.
  - name: rootsmarket_ratios
    interval: 15s
    rules:

      - record: rootsmarket:cache_hit_ratio:rate5m
        expr: |
          sum by (service) (rate(cache_hits_total[5m]))
          /
          clamp_min(
            sum by (service) (rate(cache_hits_total[5m]))
            + sum by (service) (rate(cache_misses_total[5m])),
            0.000001
          )

      - record: rootsmarket:postgres_cache_hit_ratio:rate5m
        expr: |
          sum(rate(pg_stat_database_blks_hit{datname="rootsmarket"}[5m]))
          /
          clamp_min(
            sum(rate(pg_stat_database_blks_hit{datname="rootsmarket"}[5m]))
            + sum(rate(pg_stat_database_blks_read{datname="rootsmarket"}[5m])),
            0.000001
          )

      - record: rootsmarket:redis_cache_hit_ratio:rate5m
        expr: |
          sum(rate(redis_keyspace_hits_total[5m]))
          /
          clamp_min(
            sum(rate(redis_keyspace_hits_total[5m]))
            + sum(rate(redis_keyspace_misses_total[5m])),
            0.000001
          )

  # -------------------------------------------------------------- resources
  # NOTE FOR THE K8s MIGRATION: these key off
  # container_label_com_docker_compose_service, which does not exist under
  # Kubernetes. cAdvisor there exposes `pod` and `container` instead. This
  # group is the one part of the rule set that will need rewriting — the HTTP
  # and ratio groups above transfer unchanged.
  - name: rootsmarket_resources
    interval: 15s
    rules:

      - record: rootsmarket:container_cpu_usage_cores:rate5m
        expr: |
          sum by (container_label_com_docker_compose_service) (
            rate(container_cpu_usage_seconds_total{
              job="cadvisor", container_label_com_docker_compose_service!=""
            }[5m])
          )

      # Backs the ContainerCPUThrottled alert. Reads 0 while no CPU limits are
      # set, which is the intended state — keep it as a regression guard.
      - record: rootsmarket:container_cpu_throttling:ratio5m
        expr: |
          sum by (container_label_com_docker_compose_service) (
            rate(container_cpu_cfs_throttled_periods_total{
              job="cadvisor", container_label_com_docker_compose_service!=""
            }[5m])
          )
          /
          clamp_min(
            sum by (container_label_com_docker_compose_service) (
              rate(container_cpu_cfs_periods_total{
                job="cadvisor", container_label_com_docker_compose_service!=""
              }[5m])
            ),
            0.000001
          )

      # `avg without (cpu, mode)` collapses every core; on an 8-core host that
      # is 8x the series of a plain rate, so this one is worth precomputing.
      - record: rootsmarket:node_cpu_utilisation:rate5m
        expr: |
          1 - avg without (cpu, mode) (
            rate(node_cpu_seconds_total{job="node-exporter", mode="idle"}[5m])
          )

      - record: rootsmarket:node_memory_utilisation:ratio
        expr: |
          1 - (
            node_memory_MemAvailable_bytes{job="node-exporter"}
            / node_memory_MemTotal_bytes{job="node-exporter"}
          )

  - name: rootsmarket_messaging
    interval: 30s
    rules:
      - record: rootsmarket:rabbitmq_messages_published:rate5m
        expr: sum by (service, queue) (rate(rabbitmq_messages_published_total[5m]))

      - record: rootsmarket:rabbitmq_messages_consumed:rate5m
        expr: sum by (service, queue) (rate(rabbitmq_messages_consumed_total[5m]))