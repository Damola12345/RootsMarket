# Loki runs as a single local instance for the Docker Compose environment.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  # Store Loki data on the mounted persistent volume.
  path_prefix: /loki

  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

  replication_factor: 1

  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13

      index:
        prefix: rootsmarket_index_
        period: 24h
query_range:
  align_queries_with_step: true
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 32
        ttl: 1h

limits_config:
  # Reject extremely old log entries accidentally submitted by clients.
  reject_old_samples: true
  reject_old_samples_max_age: 168h

  # Keep logs for seven days in the local environment.
  retention_period: 168h
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false

ruler:
  wal:
    dir: /loki/ruler-wal          # <- add; default "ruler-wal" is relative and unwritable
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /tmp/loki-rules
  ring:
    kvstore:
      store: inmemory
  enable_api: true
  remote_write:
    enabled: true
    client:
      url: http://prometheus:9090/api/v1/write


chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: true
      max_size_mb: 64
      ttl: 1h


frontend:
  log_queries_longer_than: 5s