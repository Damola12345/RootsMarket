# Automatically provision Prometheus, Loki and Tempo.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: rootsmarket-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: rootsmarket-tempo

  - name: Loki
    uid: rootsmarket-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      # matcherType: label reads trace_id from structured metadata, so this is
      # a label lookup rather than a regex scan of every log line.
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: rootsmarket-tempo
          url: '$${__value.raw}'
          urlDisplayLabel: View trace

  - name: Tempo
    uid: rootsmarket-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # Requires stream_over_http_enabled: true in tempo.yml, otherwise Grafana
      # attempts gRPC against the HTTP port and logs "frame too large".
      streamingEnabled:
        search: true
      tracesToLogsV2:
        datasourceUid: rootsmarket-loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: true
        # Maps the span's service.name resource attribute onto the Loki
        # `service` label so the jump is scoped to one stream.
        tags:
          - key: service.name
            value: service
      serviceMap:
        datasourceUid: rootsmarket-prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false