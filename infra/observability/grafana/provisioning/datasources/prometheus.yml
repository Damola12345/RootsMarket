# Automatically provision Prometheus as Grafana's default data source.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: rootsmarket-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090

    # Make Prometheus the default data source.
    isDefault: true

    editable: false

    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: Loki
    uid: rootsmarket-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false

    jsonData:
      timeout: 60
      maxLines: 1000

  - name: Tempo
    uid: rootsmarket-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: true

    jsonData:
      httpMethod: GET

      tracesToLogsV2:
        datasourceUid: rootsmarket-loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        tags:
          - key: service.name
            value: service
          - key: deployment.environment
            value: environment
        filterByTraceID: true
        filterBySpanID: false

      tracesToMetrics:
        datasourceUid: rootsmarket-prometheus
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        tags:
          - key: service.name
            value: service
          - key: deployment.environment
            value: environment
        queries:
          - name: Request rate
            query: >-
              sum(rate(traces_spanmetrics_calls_total{
                service_name="$${__span.tags["service.name"]}"
              }[5m]))

          - name: Error rate
            query: >-
              sum(rate(traces_spanmetrics_calls_total{
                service_name="$${__span.tags["service.name"]}",
                status_code="STATUS_CODE_ERROR"
              }[5m]))

      serviceMap:
        datasourceUid: rootsmarket-prometheus

      nodeGraph:
        enabled: true

      search:
        hide: false

      lokiSearch:
        datasourceUid: rootsmarket-loki